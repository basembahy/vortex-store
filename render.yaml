databases:
  - name: vortex-db
    databaseName: vortex_db
    user: vortex_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: vortex-store
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vortex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@vortex.store
      - key: ADMIN_PASSWORD
        value: admin123456
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
